name: Android APK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Move Files
        run: |
          unzip -o kozmetik-envanteri.zip
          # Fayllarin hansi qovluqda oldugunu deqiq mueyyen edirik
          cd kozmetik-envanteri/kozmetik-envanteri/ || cd kozmetik-envanteri/ || echo "Qovluq tapilmadi"
          chmod +x gradlew
          # Butun fayllari ana qovluga cixaririq ki, GitHub onlari gorsun
          cp -r . ../../ 2>/dev/null || cp -r . ../

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kosmetik-tetbiqi-hazirdir
          path: "**/build/outputs/apk/debug/*.apk"
