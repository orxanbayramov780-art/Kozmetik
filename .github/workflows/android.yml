name: Android APK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Find Project
        run: |
          # Bütün zip fayllarını açırıq
          unzip -o kozmetik-envanteri.zip || unzip -o Layihe.zip || echo "Zip tapılmadı"
          
          # gradlew faylını bütün qovluqlarda axtarırıq
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "HATA: gradlew tapılmadı!"
            ls -R
            exit 1
          fi
          
          # Tapılan yerə icazə veririk
          chmod +x "$GRADLEW_PATH"
          echo "PROJ_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          cd ${{ env.PROJ_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tətbiq-hazırdır
          path: "**/build/outputs/apk/debug/*.apk"
