name: Android APK Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Locate Project
        run: |
          # Movcud olan istenilen ZIP faylini acir
          unzip -o *.zip || echo "ZIP acilmadi"
          
          # Gradlew faylini butun alt qovluqlarda axtarir
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "XETA: Layihe fayllari ZIP-in icinde tapilmadi!"
            echo "Hazirda olan fayllar:"
            ls -R
            exit 1
          fi
          
          # Tapilan qovluga icaze verir ve yolunu yadda saxlayir
          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_ROOT=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV
          echo "GRADLEW_EXECUTABLE=$GRADLEW_PATH" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_ROOT }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hazir-tetbiq
          path: "**/build/outputs/apk/debug/*.apk"
